[project]
name = "bluetape-py-workspace"
version = "0.1.0"
description = "Workspace root for bluetape-py packages."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bluetape-async==0.1.0",
    "bluetape-cache==0.1.0",
    "bluetape-cache-redis==0.1.0",
    "bluetape-codec==0.1.0",
    "bluetape-collections==0.1.0",
    "bluetape-compression==0.1.0",
    "bluetape-core==0.1.0",
    "bluetape-logging==0.1.0",
    "bluetape-resilience==0.1.0",
    "bluetape-serde==0.1.0",
    "bluetape-testcontainers==0.1.0",
    "bluetape-testing==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.uv.sources]
bluetape-async = { workspace = true }
bluetape-benchmark = { workspace = true }
bluetape-cache = { workspace = true }
bluetape-cache-redis = { workspace = true }
bluetape-codec = { workspace = true }
bluetape-collections = { workspace = true }
bluetape-compression = { workspace = true }
bluetape-core = { workspace = true }
bluetape-logging = { workspace = true }
bluetape-resilience = { workspace = true }
bluetape-serde = { workspace = true }
bluetape-testcontainers = { workspace = true }
bluetape-testing = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/bluetape",
    "packages/bluetape-async",
    "packages/bluetape-benchmark",
    "packages/bluetape-cache",
    "packages/bluetape-cache-redis",
    "packages/bluetape-codec",
    "packages/bluetape-collections",
    "packages/bluetape-compression",
    "packages/bluetape-core",
    "packages/bluetape-logging",
    "packages/bluetape-resilience",
    "packages/bluetape-serde",
    "packages/bluetape-testcontainers",
    "packages/bluetape-testing",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "native_compression: requires explicit native compression providers and runs separately",
    "testcontainers: requires a Docker-compatible Testcontainers runtime and runs serially",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "RUF", "UP", "W"]
