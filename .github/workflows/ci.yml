name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"

      - name: Sync
        run: uv sync --all-packages

      - name: Assert base workspace is provider-free
        run: |
          uv run python -c '
          import importlib.util
          assert importlib.util.find_spec("pyfory") is None
          assert importlib.util.find_spec("lz4") is None
          assert importlib.util.find_spec("cramjam") is None
          assert importlib.util.find_spec("zstandard") is None
          assert importlib.util.find_spec("opentelemetry.sdk") is None
          '

      - name: Enable explicit Fory fixture checks
        run: uv sync --all-packages --extra fory --python 3.13.14 --locked

      - name: Verify committed Fory fixtures
        run: |
          uv run --package bluetape-serde --extra fory --python 3.13.14 python \
            packages/bluetape-serde/conformance/fory/python/conformance_cli.py verify \
            packages/bluetape-serde/conformance/fory/fixtures/python.bin
          uv run --package bluetape-serde --extra fory --python 3.13.14 python \
            packages/bluetape-serde/conformance/fory/verify_manifest.py \
            --manifest packages/bluetape-serde/conformance/fory/manifest.json \
            --python packages/bluetape-serde/conformance/fory/fixtures/python.bin \
            --go packages/bluetape-serde/conformance/fory/fixtures/go.bin \
            --rust packages/bluetape-serde/conformance/fory/fixtures/rust.bin \
            --kotlin packages/bluetape-serde/conformance/fory/fixtures/kotlin.bin

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Test
        run: >-
          uv run --package bluetape-serde --extra fory --python 3.13.14 pytest
          --strict-markers
          -m "not testcontainers and not native_compression and not observability_sdk"

      - name: Build distributions
        run: uv build --all-packages

      - name: Assert default wheel is Docker-provider-free
        run: |
          tmp_dir="$(mktemp -d)"
          uv build --package bluetape-core --out-dir "$tmp_dir/dist"
          uv build --package bluetape --out-dir "$tmp_dir/dist"
          uv venv "$tmp_dir/venv" --python 3.13.14
          uv pip install --python "$tmp_dir/venv/bin/python" --no-index \
            --find-links "$tmp_dir/dist" bluetape==0.1.0
          "$tmp_dir/venv/bin/python" -c \
            'import importlib.util
          assert importlib.util.find_spec("testcontainers") is None
          assert importlib.util.find_spec("docker") is None
          assert importlib.util.find_spec("redis") is None
          assert importlib.util.find_spec("opentelemetry") is None
          try:
              provider = importlib.util.find_spec("bluetape.cache.redis")
          except ModuleNotFoundError:
              provider = None
          assert provider is None
          try:
              observability = importlib.util.find_spec("bluetape.observability")
          except ModuleNotFoundError:
              observability = None
          assert observability is None'

  observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"

      - name: Sync observability test dependencies
        run: >-
          uv sync --package bluetape-observability --group test
          --python 3.13.14 --locked

      - name: Prove focused SDK and domain dependencies
        run: >-
          uv run --package bluetape-observability --group test --python 3.13.14
          python -c "import opentelemetry.sdk, bluetape.resilience, bluetape.cache.redis"

      - name: Test observability contracts
        run: >-
          uv run --package bluetape-observability --group test --python 3.13.14 pytest
          --strict-markers -m "not observability_sdk and not observability_workspace"
          packages/bluetape-observability/tests -rs -q

      - name: Test observability SDK contracts without skips
        run: |
          uv run --package bluetape-observability --group test --python 3.13.14 pytest \
            --strict-markers -m observability_sdk packages/bluetape-observability/tests \
            --junitxml="$RUNNER_TEMP/observability-sdk.xml" -rs -q
          uv run python -c 'import os, xml.etree.ElementTree as E; r=E.parse(os.environ["RUNNER_TEMP"] + "/observability-sdk.xml").getroot(); s=[r] if r.tag.endswith("testsuite") else list(r.findall("testsuite")); assert sum(int(x.attrib.get("tests", 0)) for x in s) > 0 and all(sum(int(x.attrib.get(k, 0)) for x in s) == 0 for k in ("failures", "errors", "skipped"))'

      - name: Verify focused and default wheel isolation
        run: scripts/verify-observability-wheels.sh

  redis-provider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"

      - name: Sync Redis provider dependencies
        run: >-
          uv sync --package bluetape-cache-redis --group test
          --python 3.13.14 --locked

      - name: Test Redis provider unit contracts
        run: >-
          uv run --package bluetape-cache-redis --python 3.13.14
          pytest packages/bluetape-cache-redis/tests -m "not testcontainers and not native_compression" -q

      - name: Redis provider tests serially
        run: >-
          uv run --package bluetape-cache-redis --python 3.13.14
          pytest -m testcontainers packages/bluetape-cache-redis -q

  leader-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"

      - name: Sync Redis leader test dependencies
        run: >-
          uv sync --package bluetape-leader-redis --group test
          --python 3.13.14 --locked

      - name: Verify Docker runtime
        run: docker info

      - name: Test Redis leader unit contracts
        run: >-
          uv run --package bluetape-leader-redis --group test --python 3.13.14 pytest
          --strict-markers -m "not testcontainers"
          packages/bluetape-leader-redis/tests -rs -q

      - name: Test Redis leader integration contracts serially
        run: |
          uv run --package bluetape-leader-redis --group test --python 3.13.14 pytest \
            --strict-markers -m testcontainers packages/bluetape-leader-redis/tests \
            --junitxml="$RUNNER_TEMP/leader-redis-testcontainers.xml" -rs -q
          uv run python -c 'import os, xml.etree.ElementTree as E; r=E.parse(os.environ["RUNNER_TEMP"] + "/leader-redis-testcontainers.xml").getroot(); s=[r] if r.tag.endswith("testsuite") else list(r.findall("testsuite")); assert sum(int(x.attrib.get("tests", 0)) for x in s) > 0 and all(sum(int(x.attrib.get(k, 0)) for x in s) == 0 for k in ("failures", "errors", "skipped"))'

  compression-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"

      - name: Sync native compression providers
        run: >-
          uv sync --package bluetape-compression --extra native
          --group test --python 3.13.14 --locked

      - name: Test native compression providers
        run: >-
          uv run --package bluetape-compression --extra native --python 3.13.14 pytest
          -m native_compression packages/bluetape-compression -q

      - name: Build distributions
        run: uv build --all-packages

  testcontainers-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"

      - name: Sync all fixture providers and integration clients
        run: >-
          uv sync --package bluetape-testcontainers --extra all --group test
          --python 3.13.14 --locked

      - name: Verify Docker runtime
        run: docker info

      - name: Test service wrappers serially
        run: >-
          uv run --package bluetape-testcontainers --extra all --group test --python 3.13.14 pytest
          -m testcontainers packages/bluetape-testcontainers -q
