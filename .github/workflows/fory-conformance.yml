name: Apache Fory Conformance

on:
  pull_request:
    branches: [develop]
    paths:
      - ".python-version"
      - "uv.lock"
      - "packages/bluetape/pyproject.toml"
      - "packages/bluetape-serde/pyproject.toml"
      - "packages/bluetape-serde/src/**"
      - "packages/bluetape-serde/tests/**"
      - "packages/bluetape-serde/conformance/fory/**"
      - ".github/workflows/fory-conformance.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [develop]
    paths:
      - ".python-version"
      - "uv.lock"
      - "packages/bluetape/pyproject.toml"
      - "packages/bluetape-serde/pyproject.toml"
      - "packages/bluetape-serde/src/**"
      - "packages/bluetape-serde/tests/**"
      - "packages/bluetape-serde/conformance/fory/**"
      - ".github/workflows/fory-conformance.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: fory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFORMANCE: packages/bluetape-serde/conformance/fory
  PYTHON_VERSION: "3.13.14"
  FORY_VERSION: "1.3.0"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Verify versions and install
        run: |
          test "$(python --version)" = "Python 3.13.14"
          uv sync --package bluetape-serde --extra fory --python 3.13.14 --locked
          uv run --package bluetape-serde --extra fory --python 3.13.14 python -c 'import pyfory; assert pyfory.__version__ == "1.3.0"'
      - name: Generate deterministic Python artifact
        run: |
          mkdir -p staging/fixtures
          LC_ALL=C.UTF-8 TZ=UTC uv run --package bluetape-serde --extra fory --python 3.13.14 python "$CONFORMANCE/python/conformance_cli.py" generate staging/python.first
          LC_ALL=C.UTF-8 TZ=UTC uv run --package bluetape-serde --extra fory --python 3.13.14 python "$CONFORMANCE/python/conformance_cli.py" generate staging/python.second
          cmp staging/python.first staging/python.second
          uv run --package bluetape-serde --extra fory --python 3.13.14 python "$CONFORMANCE/python/conformance_cli.py" verify staging/python.first
          cmp staging/python.first "$CONFORMANCE/fixtures/python.bin"
          cp staging/python.first staging/fixtures/python.bin
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("packages/bluetape-serde/conformance/fory/manifest.json").read_text())
          Path("staging/python-fragment.json").write_text(json.dumps(manifest["producers"]["python"], indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fory-${{ github.sha }}-python
          path: |
            staging/fixtures/python.bin
            staging/python-fragment.json
          retention-days: 7

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-1.26.5-fory-1.3.0-${{ hashFiles('packages/bluetape-serde/conformance/fory/go/go.mod', 'packages/bluetape-serde/conformance/fory/go/go.sum') }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Generate and package Go verifier
        working-directory: ${{ env.CONFORMANCE }}/go
        run: |
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          go mod download
          mkdir -p ../staging/fixtures ../staging/go-verifier
          LC_ALL=C.UTF-8 TZ=UTC go run . generate ../staging/go.first
          LC_ALL=C.UTF-8 TZ=UTC go run . generate ../staging/go.second
          cmp ../staging/go.first ../staging/go.second
          go run . verify ../fixtures/python.bin
          cmp ../staging/go.first ../fixtures/go.bin
          cp ../staging/go.first ../staging/fixtures/go.bin
          go build -trimpath -o ../staging/go-verifier/fory-go .
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C ../staging/go-verifier -cf ../staging/go-verifier.tar fory-go
          (cd ../staging && sha256sum go-verifier.tar > go-verifier.tar.sha256)
      - name: Verify Go artifact with Python and write fragment
        run: |
          uv sync --package bluetape-serde --extra fory --python 3.13.14 --locked
          uv run --package bluetape-serde --extra fory --python 3.13.14 python "$CONFORMANCE/python/conformance_cli.py" verify "$CONFORMANCE/staging/fixtures/go.bin"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("packages/bluetape-serde/conformance/fory")
          manifest = json.loads((root / "manifest.json").read_text())
          (root / "staging/go-fragment.json").write_text(json.dumps(manifest["producers"]["go"], indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fory-${{ github.sha }}-go
          path: |
            ${{ env.CONFORMANCE }}/staging/fixtures/go.bin
            ${{ env.CONFORMANCE }}/staging/go-fragment.json
            ${{ env.CONFORMANCE }}/staging/go-verifier.tar
            ${{ env.CONFORMANCE }}/staging/go-verifier.tar.sha256
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CONFORMANCE }}/rust/target
          key: rust-${{ runner.os }}-1.96.1-fory-1.3.0-${{ hashFiles('packages/bluetape-serde/conformance/fory/rust/Cargo.toml', 'packages/bluetape-serde/conformance/fory/rust/Cargo.lock', 'packages/bluetape-serde/conformance/fory/rust/rust-toolchain.toml') }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Generate and package Rust verifier
        working-directory: ${{ env.CONFORMANCE }}/rust
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          mkdir -p ../staging/fixtures ../staging/rust-verifier
          LC_ALL=C.UTF-8 TZ=UTC cargo run --locked --release -- generate ../staging/rust.first
          LC_ALL=C.UTF-8 TZ=UTC cargo run --locked --release -- generate ../staging/rust.second
          cmp ../staging/rust.first ../staging/rust.second
          cargo run --locked --release -- verify ../fixtures/python.bin
          cmp ../staging/rust.first ../fixtures/rust.bin
          cp ../staging/rust.first ../staging/fixtures/rust.bin
          cp target/release/bluetape-fory-conformance ../staging/rust-verifier/fory-rust
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C ../staging/rust-verifier -cf ../staging/rust-verifier.tar fory-rust
          (cd ../staging && sha256sum rust-verifier.tar > rust-verifier.tar.sha256)
      - name: Verify Rust artifact with Python and write fragment
        run: |
          uv sync --package bluetape-serde --extra fory --python 3.13.14 --locked
          uv run --package bluetape-serde --extra fory --python 3.13.14 python "$CONFORMANCE/python/conformance_cli.py" verify "$CONFORMANCE/staging/fixtures/rust.bin"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("packages/bluetape-serde/conformance/fory")
          manifest = json.loads((root / "manifest.json").read_text())
          (root / "staging/rust-fragment.json").write_text(json.dumps(manifest["producers"]["rust"], indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fory-${{ github.sha }}-rust
          path: |
            ${{ env.CONFORMANCE }}/staging/fixtures/rust.bin
            ${{ env.CONFORMANCE }}/staging/rust-fragment.json
            ${{ env.CONFORMANCE }}/staging/rust-verifier.tar
            ${{ env.CONFORMANCE }}/staging/rust-verifier.tar.sha256
          retention-days: 7

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "21.0.11+10"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          cache-read-only: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.gradle/caches
          key: kotlin-${{ runner.os }}-21.0.11-kotlin-2.3.20-fory-1.3.0-${{ hashFiles('packages/bluetape-serde/conformance/fory/kotlin/settings.gradle.kts', 'packages/bluetape-serde/conformance/fory/kotlin/build.gradle.kts', 'packages/bluetape-serde/conformance/fory/kotlin/gradle.lockfile', 'packages/bluetape-serde/conformance/fory/kotlin/gradle/wrapper/gradle-wrapper.properties', 'packages/bluetape-serde/conformance/fory/kotlin/gradle/wrapper/gradle-wrapper.jar') }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - name: Generate and package Kotlin verifier
        working-directory: ${{ env.CONFORMANCE }}/kotlin
        run: |
          java -version 2>&1 | grep '21.0.11'
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')" = "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"
          mkdir -p ../staging/fixtures ../staging/kotlin-verifier
          LC_ALL=C.UTF-8 TZ=UTC ./gradlew --no-daemon run --args="generate ../staging/kotlin.first"
          LC_ALL=C.UTF-8 TZ=UTC ./gradlew --no-daemon run --args="generate ../staging/kotlin.second"
          cmp ../staging/kotlin.first ../staging/kotlin.second
          LC_ALL=C.UTF-8 TZ=UTC ./gradlew --no-daemon run --args='verify ../fixtures/python.bin'
          cmp ../staging/kotlin.first ../fixtures/kotlin.bin
          cp ../staging/kotlin.first ../staging/fixtures/kotlin.bin
          ./gradlew --no-daemon installDist
          cp -R build/install/bluetape-fory-conformance/. ../staging/kotlin-verifier/
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C ../staging/kotlin-verifier -cf ../staging/kotlin-verifier.tar .
          (cd ../staging && sha256sum kotlin-verifier.tar > kotlin-verifier.tar.sha256)
      - name: Verify Kotlin artifact with Python and write fragment
        run: |
          uv sync --package bluetape-serde --extra fory --python 3.13.14 --locked
          uv run --package bluetape-serde --extra fory --python 3.13.14 python "$CONFORMANCE/python/conformance_cli.py" verify "$CONFORMANCE/staging/fixtures/kotlin.bin"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("packages/bluetape-serde/conformance/fory")
          manifest = json.loads((root / "manifest.json").read_text())
          (root / "staging/kotlin-fragment.json").write_text(json.dumps(manifest["producers"]["kotlin"], indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fory-${{ github.sha }}-kotlin
          path: |
            ${{ env.CONFORMANCE }}/staging/fixtures/kotlin.bin
            ${{ env.CONFORMANCE }}/staging/kotlin-fragment.json
            ${{ env.CONFORMANCE }}/staging/kotlin-verifier.tar
            ${{ env.CONFORMANCE }}/staging/kotlin-verifier.tar.sha256
          retention-days: 7

  conformance:
    needs: [python, go, rust, kotlin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "21.0.11+10"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: fory-${{ github.sha }}-*
          path: downloaded
          merge-multiple: true
      - name: Validate downloaded fixtures and fragments
        run: |
          uv sync --package bluetape-serde --extra fory --python 3.13.14 --locked
          for producer in python go rust kotlin; do
            cmp "downloaded/fixtures/$producer.bin" "$CONFORMANCE/fixtures/$producer.bin"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("packages/bluetape-serde/conformance/fory/manifest.json").read_text())
          for producer in ("python", "go", "rust", "kotlin"):
              fragment = json.loads(Path(f"downloaded/{producer}-fragment.json").read_text())
              assert fragment == manifest["producers"][producer]
          PY
          uv run --package bluetape-serde --extra fory --python 3.13.14 python "$CONFORMANCE/verify_manifest.py" \
            --manifest "$CONFORMANCE/manifest.json" \
            --python downloaded/fixtures/python.bin \
            --go downloaded/fixtures/go.bin \
            --rust downloaded/fixtures/rust.bin \
            --kotlin downloaded/fixtures/kotlin.bin
      - name: Validate and run downloaded verifiers
        run: |
          for producer in go rust kotlin; do
            (cd downloaded && sha256sum -c "$producer-verifier.tar.sha256")
            mkdir -p "downloaded/$producer-verifier"
            tar -xf "downloaded/$producer-verifier.tar" -C "downloaded/$producer-verifier"
          done
          test -x downloaded/go-verifier/fory-go
          test -x downloaded/rust-verifier/fory-rust
          test -x downloaded/kotlin-verifier/bin/bluetape-fory-conformance
          downloaded/go-verifier/fory-go verify downloaded/fixtures/python.bin
          downloaded/rust-verifier/fory-rust verify downloaded/fixtures/python.bin
          downloaded/kotlin-verifier/bin/bluetape-fory-conformance verify downloaded/fixtures/python.bin
