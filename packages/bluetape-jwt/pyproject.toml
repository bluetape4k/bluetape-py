[project]
name = "bluetape-jwt"
version = "0.1.0"
description = "Strict JWT signing, verification, and key-rotation helpers for bluetape-py."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bluetape-cache==0.1.0",
    "joserfc>=1.7.4,<2",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bluetape.jwt"
