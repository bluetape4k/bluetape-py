[project]
name = "bluetape-compression"
version = "0.1.0"
description = "Bounded stdlib compression helpers for bluetape-py."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
lz4 = ["lz4==4.4.5"]
snappy = ["cramjam==2.11.0"]
zstd = ["zstandard==0.25.0"]
native = ["lz4==4.4.5", "cramjam==2.11.0", "zstandard==0.25.0"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bluetape.compression"
