[project]
name = "bluetape-testing"
version = "0.1.0"
description = "Internal-first pytest helpers for bluetape-py."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bluetape.testing"
