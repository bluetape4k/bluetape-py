[project]
name = "bluetape"
version = "0.1.0"
description = "Thin meta distribution for Python-native bluetape packages."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["bluetape-core==0.1.0"]

[project.optional-dependencies]
asyncio = ["bluetape-async==0.1.0"]
cache = ["bluetape-cache==0.1.0"]
codec = ["bluetape-codec==0.1.0"]
collections = ["bluetape-collections==0.1.0"]
compression = ["bluetape-compression==0.1.0"]
logging = ["bluetape-logging==0.1.0"]
serde = ["bluetape-serde==0.1.0"]
fory = ["bluetape-serde[fory]==0.1.0"]
testing = ["bluetape-testing==0.1.0"]
dev = [
    "bluetape-async==0.1.0",
    "bluetape-cache==0.1.0",
    "bluetape-codec==0.1.0",
    "bluetape-collections==0.1.0",
    "bluetape-compression==0.1.0",
    "bluetape-logging==0.1.0",
    "bluetape-serde==0.1.0",
    "bluetape-testing==0.1.0",
]
all = [
    "bluetape-async==0.1.0",
    "bluetape-cache==0.1.0",
    "bluetape-codec==0.1.0",
    "bluetape-collections==0.1.0",
    "bluetape-compression==0.1.0",
    "bluetape-logging==0.1.0",
    "bluetape-serde==0.1.0",
    "bluetape-testing==0.1.0",
]

[tool.uv.sources]
bluetape-async = { workspace = true }
bluetape-cache = { workspace = true }
bluetape-codec = { workspace = true }
bluetape-collections = { workspace = true }
bluetape-compression = { workspace = true }
bluetape-core = { workspace = true }
bluetape-logging = { workspace = true }
bluetape-serde = { workspace = true }
bluetape-testing = { workspace = true }

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
