[project]
name = "bluetape-leader-redis"
version = "0.1.0"
description = "Redis adapter package boundary for bluetape-py leader contracts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bluetape-leader==0.1.0",
    "redis==8.0.1",
]

[dependency-groups]
test = [
    "bluetape-testcontainers==0.1.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bluetape.leader.redis"
