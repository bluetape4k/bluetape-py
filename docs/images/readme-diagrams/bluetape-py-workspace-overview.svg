  <text x="720" y="232" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">thin meta distribution: default dependency is bluetape-core only</text>

  <line x1="720" y1="284" x2="720" y2="336" stroke="#57708F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
