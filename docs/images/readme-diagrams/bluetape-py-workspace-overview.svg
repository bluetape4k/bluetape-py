<text x="1160.0" y="595.12" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">serde</text>
<text x="1160.0" y="615.12" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">cache</text>
<text x="1160.0" y="635.12" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">redis</text>
<text x="1160.0" y="655.12" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">testcontainers</text>

  <rect x="116" y="706" width="1208" height="76" rx="18" fill="#FFFFFF" stroke="#D5DFEC" stroke-width="2"/>
  <text x="720" y="734" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">0.1.0 track: issues #1-#5 keep core, logging, testing, docs, and release preflight visible</text>
  <text x="720" y="762" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">Rule: Python-native APIs first; no mechanical Kotlin, Go, or Rust porting</text>
