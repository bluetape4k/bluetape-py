<text x="720.0" y="435.28" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">validation foundation</text>

