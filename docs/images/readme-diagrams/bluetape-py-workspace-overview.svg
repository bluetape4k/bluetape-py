<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840"
  viewBox="0 0 1440 840">

  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6FAFF"/>
      <stop offset="48%" stop-color="#EDF7F5"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#60728A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7"
      orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path d="M 2 2 L 12 7 L 2 12 Z" fill="#57708F" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="secondary" data-tip-direction="positive-x">
      <path d="M 2 2 L 8 5 L 2 8 Z" fill="#8A9BB0" stroke-dasharray="none"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="840" rx="0" fill="#F8FAFC" stroke="#D9E2EF" stroke-width="0"/>
  <text x="720" y="64" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="40" font-weight="700" fill="#172033" text-anchor="middle" dominant-baseline="middle">bluetape-py workspace overview</text>
  <text x="720" y="102" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="400" fill="#58677D" text-anchor="middle" dominant-baseline="middle">single repository / uv workspace / focused PyPI distributions</text>

  <rect x="72" y="150" width="1296" height="134" rx="26" fill="#FFFFFF" stroke="#CBD7E6" stroke-width="2"/>
