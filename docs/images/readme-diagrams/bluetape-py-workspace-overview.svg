<text x="720.0" y="605.12" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">pytest helpers</text>
<text x="720.0" y="625.12" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">internal-first</text>
<text x="720.0" y="645.12" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">async waits</text>
  <rect x="980" y="520" width="360" height="146" rx="16" fill="#F7FAFE" stroke="#B8C7DC" stroke-width="2"/>
