<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" role="img" aria-label="Synchronous Resilience Pipeline sequence">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64834A" stroke="#64834A" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#A97924" stroke="#A97924" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89" stroke="#2E8F89" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#A95D61" stroke="#A95D61" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 13 13" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FBFCF8;stroke:#41545D;stroke-width:3;filter:url(#shadow)}
      .title{font-family:"Architects Daughter",ui-rounded,system-ui,sans-serif;font-size:42px;fill:#263238}
      .subtitle,.detail,.footer,.config{font-family:"Comic Mono",ui-monospace,SFMono-Regular,Menlo,monospace;fill:#36464F}
      .subtitle{font-size:16px}.config{font-size:14px}.footer{font-size:15px}
      rect.participant{fill:#FFFFFF;stroke:#546E7A;stroke-width:2;filter:url(#shadow)}
      .participantTitle{font-family:"Architects Daughter",ui-rounded,system-ui,sans-serif;font-size:22px;fill:#1F3138}
      .participantRole{font-family:"Comic Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#60727D}
      .lifeline{stroke:#9AAAB1;stroke-width:2;stroke-dasharray:7 8}
      .activation{stroke-width:1.5}
      .seq,.call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .seqReturn,.return{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
      .labelPill,.label{fill:#FFFFFF;stroke-width:1.4}
      .detail{font-size:13px;font-weight:700}
      .altBox,.loopFrame{fill:#EEF7F0;fill-opacity:.12;stroke:#78909C;stroke-width:2.4;stroke-dasharray:12 7}
      .branchDivider{stroke:#78909C;stroke-width:2;stroke-dasharray:10 8}
    </style>
  </defs>

  <rect class="canvas" width="1900" height="1180"/>
  <rect class="frame" x="32" y="28" width="1836" height="1124" rx="30"/>
  <text class="title" x="70" y="82">Synchronous Resilience Pipeline</text>
  <text class="subtitle" x="74" y="114">Last-added policy runs first; cleanup and outcomes unwind through the wrapper stack.</text>

  <rect x="74" y="136" width="1752" height="42" rx="12" fill="#FFFFFF" stroke="#D7E0E4" stroke-width="1.6"/>
  <text class="config" x="950" y="162" text-anchor="middle">configured: circuit breaker -&gt; retry -&gt; bulkhead   |   runtime: bulkhead -&gt; retry -&gt; circuit breaker -&gt; operation</text>

  <g id="participant-caller">
    <rect class="participant" x="70" y="205" width="220" height="76" rx="12"/>
    <text class="participant participantTitle" x="180" y="242" text-anchor="middle">Caller</text>
    <text class="participantRole" x="180" y="264" text-anchor="middle">@pipeline / .call()</text>
    <line class="lifeline" x1="180" y1="281" x2="180" y2="1032"/>
  </g>
  <g id="participant-pipeline">
    <rect class="participant" x="365" y="205" width="270" height="76" rx="12"/>
    <text class="participant participantTitle" x="500" y="242" text-anchor="middle">ResiliencePipeline</text>
    <text class="participantRole" x="500" y="264" text-anchor="middle">immutable wrapper builder</text>
    <line class="lifeline" x1="500" y1="281" x2="500" y2="1032"/>
  </g>
  <g id="participant-bulkhead">
    <rect class="participant" x="690" y="205" width="220" height="76" rx="12"/>
    <text class="participant participantTitle" x="800" y="242" text-anchor="middle">Bulkhead</text>
    <text class="participantRole" x="800" y="264" text-anchor="middle">bounded admission</text>
    <line class="lifeline" x1="800" y1="281" x2="800" y2="1032"/>
  </g>
  <g id="participant-retry">
    <rect class="participant" x="970" y="205" width="220" height="76" rx="12"/>
    <text class="participant participantTitle" x="1080" y="242" text-anchor="middle">Retry</text>
    <text class="participantRole" x="1080" y="264" text-anchor="middle">bounded attempts</text>
    <line class="lifeline" x1="1080" y1="281" x2="1080" y2="1032"/>
  </g>
  <g id="participant-circuit">
    <rect class="participant" x="1255" y="205" width="270" height="76" rx="12"/>
    <text class="participant participantTitle" x="1390" y="242" text-anchor="middle">CircuitBreaker</text>
    <text class="participantRole" x="1390" y="264" text-anchor="middle">stateful admission</text>
    <line class="lifeline" x1="1390" y1="281" x2="1390" y2="1032"/>
  </g>
  <g id="participant-operation">
    <rect class="participant" x="1590" y="205" width="220" height="76" rx="12"/>
    <text class="participant participantTitle" x="1700" y="242" text-anchor="middle">Operation</text>
    <text class="participantRole" x="1700" y="264" text-anchor="middle">caller-owned work</text>
    <line class="lifeline" x1="1700" y1="281" x2="1700" y2="1032"/>
  </g>

  <rect class="activation" x="492" y="332" width="16" height="676" rx="5" fill="#EAF4F8" stroke="#4F83BF"/>
  <rect class="activation" x="792" y="407" width="16" height="540" rx="5" fill="#FFF7E8" stroke="#A97924"/>
  <rect class="activation" x="1072" y="482" width="16" height="398" rx="5" fill="#EEF7F0" stroke="#64834A"/>
  <rect class="activation" x="1382" y="557" width="16" height="258" rx="5" fill="#FFF0F0" stroke="#A95D61"/>
  <rect class="activation" x="1692" y="645" width="16" height="104" rx="5" fill="#EAF7F6" stroke="#2E8F89"/>

  <g id="message-1">
    <rect class="labelPill label" x="224" y="296" width="232" height="32" rx="16" stroke="#4F83BF"/>
    <circle cx="244" cy="312" r="12" fill="#EAF4F8" stroke="#4F83BF"/>
    <text class="detail" x="244" y="313" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">1</text>
    <text class="detail" x="344" y="313" text-anchor="middle" dominant-baseline="middle">call decorated function</text>
    <path class="seq call" d="M 180 340 L 500 340" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  </g>

  <g id="message-2">
    <rect class="labelPill label" x="538" y="371" width="224" height="32" rx="16" stroke="#A97924"/>
    <circle cx="558" cy="387" r="12" fill="#FFF7E8" stroke="#A97924"/>
    <text class="detail" x="558" y="388" text-anchor="middle" dominant-baseline="middle" fill="#A97924">2</text>
    <text class="detail" x="662" y="388" text-anchor="middle" dominant-baseline="middle">acquire bounded permit</text>
    <path class="seq call" d="M 500 415 L 800 415" stroke="#A97924" marker-end="url(#arrow-amber)"/>
  </g>

  <rect class="loopFrame" x="936" y="432" width="820" height="408" rx="18"/>
  <rect class="labelPill label" x="960" y="416" width="286" height="32" rx="16" stroke="#64834A"/>
  <text class="detail" x="1103" y="433" text-anchor="middle" dominant-baseline="middle">loop retryable failure / max_attempts</text>

  <g id="message-3">
    <rect class="labelPill label" x="822" y="446" width="236" height="32" rx="16" stroke="#64834A"/>
    <circle cx="842" cy="462" r="12" fill="#EEF7F0" stroke="#64834A"/>
    <text class="detail" x="842" y="463" text-anchor="middle" dominant-baseline="middle" fill="#64834A">3</text>
    <text class="detail" x="950" y="463" text-anchor="middle" dominant-baseline="middle">begin bounded attempt</text>
    <path class="seq call" d="M 800 490 L 1080 490" stroke="#64834A" marker-end="url(#arrow-green)"/>
  </g>

  <g id="message-4">
    <rect class="labelPill label" x="1110" y="521" width="250" height="32" rx="16" stroke="#A95D61"/>
    <circle cx="1130" cy="537" r="12" fill="#FFF0F0" stroke="#A95D61"/>
    <text class="detail" x="1130" y="538" text-anchor="middle" dominant-baseline="middle" fill="#A95D61">4</text>
    <text class="detail" x="1245" y="538" text-anchor="middle" dominant-baseline="middle">request circuit admission</text>
    <path class="seq call" d="M 1080 565 L 1390 565" stroke="#A95D61" marker-end="url(#arrow-red)"/>
  </g>

  <rect class="altBox" x="1220" y="590" width="536" height="230" rx="16"/>
  <rect class="labelPill label" x="1244" y="574" width="238" height="32" rx="16" stroke="#78909C"/>
  <text class="detail" x="1363" y="591" text-anchor="middle" dominant-baseline="middle">alt success / classified failure</text>
  <line class="branchDivider" x1="1220" y1="744" x2="1756" y2="744"/>
  <text class="detail" x="1515" y="766" fill="#A95D61">else retryable failure</text>

  <g id="message-5">
    <rect class="labelPill label" x="1430" y="611" width="230" height="32" rx="16" stroke="#755BC6"/>
    <circle cx="1450" cy="627" r="12" fill="#F3ECFF" stroke="#755BC6"/>
    <text class="detail" x="1450" y="628" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">5</text>
    <text class="detail" x="1555" y="628" text-anchor="middle" dominant-baseline="middle">execute operation</text>
    <path class="seq call" d="M 1390 655 L 1700 655" stroke="#755BC6" marker-end="url(#arrow-purple)"/>
  </g>

  <g id="message-6">
    <rect class="labelPill label" x="1410" y="681" width="270" height="32" rx="16" stroke="#2E8F89"/>
    <circle cx="1430" cy="697" r="12" fill="#EAF7F6" stroke="#2E8F89"/>
    <text class="detail" x="1430" y="698" text-anchor="middle" dominant-baseline="middle" fill="#2E8F89">6</text>
    <text class="detail" x="1555" y="698" text-anchor="middle" dominant-baseline="middle">value or operation failure</text>
    <path class="seqReturn return" d="M 1700 725 L 1390 725" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  </g>

  <g id="message-7">
    <rect class="labelPill label" x="1120" y="757" width="230" height="32" rx="16" stroke="#A95D61"/>
    <circle cx="1140" cy="773" r="12" fill="#FFF0F0" stroke="#A95D61"/>
    <text class="detail" x="1140" y="774" text-anchor="middle" dominant-baseline="middle" fill="#A95D61">7</text>
    <text class="detail" x="1245" y="774" text-anchor="middle" dominant-baseline="middle">record and classify</text>
    <path class="seqReturn return" d="M 1390 805 L 1080 805" stroke="#A95D61" marker-end="url(#arrow-red)"/>
  </g>

  <g id="message-8">
    <rect class="labelPill label" x="824" y="846" width="232" height="32" rx="16" stroke="#A97924"/>
    <circle cx="844" cy="862" r="12" fill="#FFF7E8" stroke="#A97924"/>
    <text class="detail" x="844" y="863" text-anchor="middle" dominant-baseline="middle" fill="#A97924">8</text>
    <text class="detail" x="950" y="863" text-anchor="middle" dominant-baseline="middle">final outcome unwinds</text>
    <path class="seqReturn return" d="M 1080 895 L 800 895" stroke="#A97924" marker-end="url(#arrow-amber)"/>
  </g>

  <g id="message-9">
    <rect class="labelPill label" x="392" y="922" width="276" height="32" rx="16" stroke="#2E8F89"/>
    <circle cx="412" cy="938" r="12" fill="#EAF7F6" stroke="#2E8F89"/>
    <text class="detail" x="412" y="939" text-anchor="middle" dominant-baseline="middle" fill="#2E8F89">9</text>
    <text class="detail" x="540" y="939" text-anchor="middle" dominant-baseline="middle">release permit / final outcome</text>
    <path class="seqReturn return" d="M 800 970 L 500 970" stroke="#2E8F89" marker-end="url(#arrow-teal)"/>
  </g>

  <g id="message-10">
    <rect class="labelPill label" x="224" y="982" width="232" height="32" rx="16" stroke="#4F83BF"/>
    <circle cx="244" cy="998" r="12" fill="#EAF4F8" stroke="#4F83BF"/>
    <text class="detail" x="244" y="999" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">10</text>
    <text class="detail" x="344" y="999" text-anchor="middle" dominant-baseline="middle">return value or raise</text>
    <path class="seqReturn return" d="M 500 1025 L 180 1025" stroke="#4F83BF" marker-end="url(#arrow-blue)"/>
  </g>

  <rect x="204" y="1065" width="1492" height="48" rx="14" fill="#FFFFFF" stroke="#D7E0E4" stroke-width="1.6"/>
  <text class="footer" x="950" y="1095" text-anchor="middle">Sync timeout is intentionally absent: no hidden thread or process owns or outlives the call.</text>
</svg>
