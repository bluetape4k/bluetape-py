<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"
  viewBox="0 0 1600 900">

  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6FAFF"/>
      <stop offset="48%" stop-color="#EDF7F5"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#60728A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7"
      orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12 Z" fill="#57708F"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5"
      orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 8 5 L 2 8 Z" fill="#8A9BB0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#hero-bg)" stroke="#D9E2EF" stroke-width="0"/>
  <g filter="url(#soft-shadow)">
    <rect x="86" y="82" width="1428" height="736" rx="36" fill="#FFFFFF" stroke="#DCE6F2" stroke-width="2"/>
  </g>
  <text x="150" y="166" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="62" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="middle">bluetape-py</text>
  <text x="152" y="230" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="400" fill="#42526A" text-anchor="start" dominant-baseline="middle">Python-native backend foundation</text>
  <text x="154" y="269.0" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="middle">thin default install</text>
<text x="154" y="315.0" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="middle">multiple PyPI distributions</text>
<text x="154" y="361.0" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="middle">one bluetape.* namespace</text>
<text x="154" y="407.0" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="middle">Python 3.13+ only</text>
  <rect x="150" y="526" width="532" height="116" rx="24" fill="#F7FAFE" stroke="#B8C7DC" stroke-width="2"/>
  <text x="182" y="568" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="middle">pip install bluetape</text>
  <text x="182" y="612" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="400" fill="#58677D" text-anchor="start" dominant-baseline="middle">installs bluetape-core only</text>
  <line x1="720" y1="584" x2="938" y2="584" stroke="#57708F" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g>
    <rect x="980" y="222" width="420" height="104" rx="16" fill="#FFFFFF" stroke="#9BC4FF" stroke-width="2"/>
<text x="1190.0" y="257.36" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="middle" dominant-baseline="middle">bluetape-core</text>
<text x="1190.0" y="286.88" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">stdlib-only</text>
<text x="1190.0" y="306.88" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">validation</text><rect x="980" y="358" width="420" height="104" rx="16" fill="#F9FEFC" stroke="#8EDCC7" stroke-width="2"/>
<text x="1190.0" y="393.36" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="middle" dominant-baseline="middle">bluetape-logging</text>
<text x="1190.0" y="422.88" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">logging</text>
<text x="1190.0" y="442.88" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">contextvars</text><rect x="980" y="494" width="420" height="104" rx="16" fill="#FFFDF7" stroke="#F2C879" stroke-width="2"/>
<text x="1190.0" y="529.36" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="middle" dominant-baseline="middle">bluetape-testing</text>
<text x="1190.0" y="558.88" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">pytest</text>
<text x="1190.0" y="578.88" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">internal-first</text>
  </g>
  <text x="1110" y="704" font-family="Architects Daughter, ui-rounded, system-ui, sans-serif" font-size="22" font-weight="400" fill="#42526A" text-anchor="middle" dominant-baseline="middle">extras open heavier capabilities explicitly</text>
  <text x="1110" y="746" font-family="Comic Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="400" fill="#58677D" text-anchor="middle" dominant-baseline="middle">bluetape[logging] / bluetape[testing] / future adapters</text>
</svg>
